# Weekly dependency update PRs. See:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Only touch uv.lock while the lower bounds in pyproject.toml still allow the new
    # version, so `just update-template` doesn't conflict with bumped bounds.
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
