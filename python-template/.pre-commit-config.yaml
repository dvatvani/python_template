default_install_hook_types: [pre-commit, commit-msg]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v6.0.0"
  hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
- repo: local
  hooks:
    - id: commitizen
      name: commitizen check
      entry: uv run --quiet cz check --allow-abort --commit-msg-file
      language: system
      stages: [commit-msg]
    - id: ruff-format
      name: ruff-format
      entry: uv run --quiet ruff format
      language: system
      types_or: [python, pyi, jupyter]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: ruff-lint
      name: ruff-lint
      entry: uv run --quiet ruff check --fix
      language: system
      types_or: [python, pyi, jupyter]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
    - id: type-check
      name: type-check
      entry: uv run ty check
      language: system
      types_or: [python, pyi, jupyter]
      require_serial: true
      stages: [pre-commit, pre-merge-commit, pre-push, manual]
