package_name:
    type: str
    placeholder: YOUR-PROJECT-NAME
    help: Name of the Python package.
    # Must map to a valid PyPI project name and Python module name once spaces and
    # underscores are normalised (see project_slug / project_slug_underscore below).
    validator: >-
        {% if not (package_name | regex_search('^[A-Za-z]([A-Za-z0-9 _-]*[A-Za-z0-9])?$')) %}
        Must start with a letter, end with a letter or digit, and contain only letters, digits, spaces, hyphens and underscores.
        {% endif %}

project_slug:
    type: str
    default: "{{ package_name.lower().replace(' ', '_').replace('_','-') }}"
    when: false

project_slug_underscore:
    type: str
    default: "{{ project_slug.replace('-','_') }}"
    when: false

# Python version for generated projects. Not a question: bump it here and existing
# projects pick it up on `just update-template`.
python_version:
    type: str
    default: "3.15"
    when: false

project_description:
    type: str
    help: Description of the project.
    default: "A python project"

github_username:
    type: str
    help: GitHub username or organization name.
    default: dvatvani

_subdirectory: python-template

_message_after_copy: |
    Your project "{{ project_slug }}" has been created successfully!

    1. Set up the local environment and make the first commit:

        cd {{ _copier_conf.dst_path }}
        git init --initial-branch=main
        just install
        git add .
        git commit -m "feat: first commit"

    2. Create the GitHub repository and push to it with the GitHub CLI:

        gh repo create {{ github_username }}/{{ project_slug }} --private --source=. --push

       Or create the repository on github.com and run:

        git remote add origin https://github.com/{{ github_username }}/{{ project_slug }}.git
        git push --set-upstream origin main

_message_after_update: |
    Your project "{{ project_slug }}" has been updated successfully!
    In case there are any conflicts, please resolve them. Then,
    you're done.

_min_copier_version: "9.19.0"